<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Calendar card -->
  <g filter="url(#shadow)">
    <rect x="88" y="104" width="336" height="296" rx="36" fill="#FFFFFF" fill-opacity="0.95" />
    
    <!-- Calendar Header -->
    <path d="M88 140 C88 120.1 104.1 104 124 104 L388 104 C407.9 104 424 120.1 424 140 L424 176 L88 176 Z" fill="#EF4444" />
    
    <!-- Calendar rings -->
    <rect x="156" y="80" width="20" height="48" rx="10" fill="#CBD5E1" stroke="#FFFFFF" stroke-width="4" />
    <rect x="336" y="80" width="20" height="48" rx="10" fill="#CBD5E1" stroke="#FFFFFF" stroke-width="4" />
    
    <!-- Calendar grid lines/dots -->
    <circle cx="160" cy="224" r="14" fill="#3B82F6" />
    <circle cx="256" cy="224" r="14" fill="#3B82F6" />
    <circle cx="352" cy="224" r="14" fill="#EF4444" /> <!-- Unbooked alert day -->

    <circle cx="160" cy="288" r="14" fill="#3B82F6" />
    <circle cx="256" cy="288" r="14" fill="#EF4444" /> <!-- Unbooked alert day -->
    <circle cx="352" cy="288" r="14" fill="#94A3B8" />

    <circle cx="160" cy="352" r="14" fill="#94A3B8" />
    <circle cx="256" cy="352" r="14" fill="#3B82F6" />
    <circle cx="352" cy="352" r="14" fill="#10B981" />
  </g>

  <!-- SMS Speech Bubble overlay badge -->
  <g filter="url(#shadow)" transform="translate(250, 240)">
    <path d="M0 64 C0 28.65 28.65 0 64 0 L156 0 C191.35 0 220 28.65 220 64 L220 100 C220 135.35 191.35 164 156 164 L96 164 L36 208 L46 164 L36 164 C16.1 164 0 147.9 0 128 Z" fill="url(#bubbleGrad)" />
    
    <!-- SMS text inside speech bubble -->
    <text x="110" y="105" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SMS</text>
    
    <!-- Small send arrow / signal waves -->
    <circle cx="178" cy="46" r="10" fill="#FEF08A" />
  </g>

  <!-- Notification alert badge at top right -->
  <g filter="url(#shadow)">
    <circle cx="410" cy="110" r="42" fill="#EF4444" stroke="#FFFFFF" stroke-width="8" />
    <path d="M410 88 L410 114 M410 126 L410 132" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
